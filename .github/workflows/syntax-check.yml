name: Python Syntax Guard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-syntax:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install Linting Tool (Ruff)
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run Syntax Check
      run: |
        # Esto buscará errores de código que puedan romper el bot
        ruff check .
